services:
  - type: web
    name: aniflix-auto-rename-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_NAME
        value: autorenamebot
      - key: STORAGE_CHANNEL_ID
        sync: false
      - key: STORAGE_CHANNEL_USERNAME
        sync: false
      - key: ADMIN
        sync: false
      - key: LOG_CHANNEL
        sync: false
      - key: SUPPORT_CHAT
        sync: false
      - key: FORCE_SUB_CHANNELS
        sync: false
      - key: START_PIC
        value: https://graph.org/file/29a3acbbab9de5f45a5fe.jpg
      - key: WEBHOOK
        value: "true"
